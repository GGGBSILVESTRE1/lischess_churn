[project]
name = "lischess-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guilherme", email = "gggbsilvestre@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.163.1",
    "fastparquet>=2026.9.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
lischess-churn = "lischess_churn.ingestion:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
